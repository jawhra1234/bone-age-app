<!DOCTYPE html>
<html>
<head>
    <title>Bone Age Predictor</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            margin-top: 60px;
        }

        .card {
            background: white;
            padding: 30px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-top: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        img {
            max-width: 200px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
<div class="card">
    <h2>🦴 Bone Age Prediction</h2>

    <input type="file" id="image">
    <br><br>
    <button onclick="predict()">Predict</button>

    <p id="result"></p>
</div>

<script>
async function predict() {
    let file = document.getElementById("image").files[0];

    if (!file) {
        alert("Please select an image!");
        return;
    }

    let formData = new FormData();
    formData.append("file", file);

    let response = await fetch("/predict", {
        method: "POST",
        body: formData
    });

    let data = await response.json();
    document.getElementById("result").innerHTML =
        "✅ Predicted Bone Age: <b>" + data.predicted_bone_age_months + " months</b>";
}
</script>
</body>
</html>
